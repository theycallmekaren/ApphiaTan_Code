<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Items to Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/member/products">Restaurant Ordering System</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <div class="navbar-nav ms-auto align-items-lg-center">
          <span class="navbar-text me-lg-3">Welcome</span>
          <a class="nav-link" href="/member/products">Products</a>
          <a class="nav-link" href="/feedback/retrieve">View All Feedback</a>
          <a class="nav-link" href="/member/review.html">Write a Review</a>
          <a class="nav-link" href="/cart/retrieve/all">My Cart</a>
          <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container mt-4 mb-5">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Add Items to Cart</h4>

        <div id="message" class="alert" role="alert" style="display: none;"></div>

        <div id="loading" class="text-center py-4">
          <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">Loading products...</span>
          </div>
        </div>

        <div class="table-responsive">
          <table id="product-table" class="table table-striped align-middle" style="display: none;">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Category</th>
                <th>Price ($)</th>
                <th>Quantity</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
          </table>
        </div>

        <div id="no-products" class="alert alert-info mt-3" style="display: none;">
          No products available.
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadProducts);

    async function loadProducts() {
      const loading = document.getElementById('loading');
      const productTable = document.getElementById('product-table');
      const tbody = document.getElementById('product-table-body');
      const noProducts = document.getElementById('no-products');

      try {
        const response = await fetch('/products', {
          headers: { 'Accept': 'application/json' }
        });
        const result = await response.json();
        const products = result.success ? result.products.filter(function (product) {
          return product.is_available;
        }) : [];

        loading.style.display = 'none';

        if (products.length === 0) {
          noProducts.style.display = 'block';
          return;
        }

        products.forEach(function (product) {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${product.name}</td>
            <td>${product.description || '-'}</td>
            <td>${product.category || '-'}</td>
            <td>${Number(product.price).toFixed(2)}</td>
            <td>
              <label class="visually-hidden" for="quantity-${product.product_id}">Quantity</label>
              <input class="form-control form-control-sm" style="width: 80px;"
                id="quantity-${product.product_id}" type="number" min="1" step="1" value="1">
            </td>
            <td>
              <button class="btn btn-primary btn-sm" type="button"
                onclick="addToCart(${product.product_id})">Add</button>
            </td>
          `;
          tbody.appendChild(row);
        });

        productTable.style.display = 'table';
      } catch (error) {
        loading.style.display = 'none';
        showMessage('Failed to load products.', 'danger');
      }
    }

    async function addToCart(productId) {
      const quantity = Number(document.getElementById(`quantity-${productId}`).value);

      if (!Number.isInteger(quantity) || quantity <= 0) {
        showMessage('Quantity must be a positive whole number.', 'danger');
        return;
      }

      try {
        const response = await fetch('/cart/createCartItem', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            product_id: productId,
            quantity: quantity
          })
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          showMessage(result.message || 'Failed to add item.', 'danger');
          return;
        }

        showMessage('Item added to cart successfully.', 'success');
      } catch (error) {
        showMessage('Failed to add item.', 'danger');
      }
    }

    function showMessage(text, type) {
      const message = document.getElementById('message');
      message.className = `alert alert-${type}`;
      message.textContent = text;
      message.style.display = 'block';
    }
  </script>
</body>
</html>
